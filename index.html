<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Matchagana</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <h1>Matchagana</h1>
    <p class="tagline muted">Match-a-<span lang="ja">がな</span> · kana, words &amp; kanji practice</p>
  </header>

  <main>
    <section id="menu" class="menu">
      <fieldset>
        <legend>1. Mode</legend>
        <div id="mode-list"></div>
      </fieldset>

      <fieldset>
        <legend>2. Content</legend>
        <div class="filter-actions">
          <button type="button" class="link" id="filter-all">Select all</button>
          <button type="button" class="link" id="filter-none">Clear</button>
        </div>
        <div id="filter-list" class="chip-list"></div>
      </fieldset>

      <fieldset>
        <legend>3. Difficulty</legend>
        <div id="level-list" class="level-list"></div>
      </fieldset>

      <fieldset id="input-field" hidden>
        <legend>4. Answer with</legend>
        <div id="input-list" class="chip-list"></div>
      </fieldset>

      <fieldset id="hide-field" hidden>
        <legend>Challenge</legend>
        <label class="chip"><input type="checkbox" id="hide-options"> <span>Hide options until I click Show</span></label>
        <p id="hide-note" class="muted hide-note"></p>
      </fieldset>

      <div class="start-row">
        <button type="button" id="start" class="primary">Start</button>
        <span id="available" class="muted"></span>
      </div>
    </section>

    <section id="quiz" class="quiz" hidden>
      <div class="hud">
        <span id="q-mode" class="hud-mode"></span>
        <span>Question <strong id="q-progress"></strong></span>
        <span>Score <strong id="q-score"></strong></span>
        <span>Streak <strong id="q-streak"></strong></span>
        <span class="hud-buttons"><button type="button" id="quit">Quit</button></span>
      </div>
      <div id="timer" class="timer" hidden><span></span></div>

      <div id="prompt" class="prompt"></div>

      <button type="button" id="reveal" class="primary reveal" hidden>Show options <span class="muted-key">(Space)</span></button>

      <div id="choices" class="choices"></div>

      <form id="type-form" class="type-form" autocomplete="off" hidden>
        <input id="type-input" type="text" spellcheck="false" autocapitalize="off">
        <button type="submit" class="primary">Check</button>
      </form>
      <div id="keyboard" class="keyboard" hidden></div>

      <div id="feedback" class="feedback" hidden>
        <p id="feedback-text" class="feedback-text"></p>
        <p id="feedback-yours" class="feedback-yours" lang="ja" hidden></p>
        <p id="feedback-info" class="feedback-info" lang="ja"></p>
        <button type="button" id="next" class="primary">Next ⏎</button>
      </div>
    </section>

    <section id="results" class="results" hidden>
      <h2 lang="ja" id="results-title"></h2>
      <p id="results-stats" class="results-stats"></p>
      <p id="results-best" class="muted"></p>
      <div id="missed-wrap">
        <h3>To review</h3>
        <ul id="missed" class="missed"></ul>
      </div>
      <div class="dialog-buttons">
        <button type="button" id="again" class="primary">Play again</button>
        <button type="button" id="to-menu">Menu</button>
      </div>
    </section>
  </main>

  <script src="data.js"></script>
  <script src="game.js"></script>
</body>
</html>
